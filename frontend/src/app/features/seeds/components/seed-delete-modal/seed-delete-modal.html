<div
  (click)="cancelAction.emit()"
  (keydown.enter)="cancelAction.emit()"
  (keydown.space)="cancelAction.emit()"
  role="button"
  tabindex="0"
  aria-label="Cerrar modal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4"
>
  <!-- Caja del Modal: stopPropagation() evita que hacer clic adentro lo cierre -->
  <div
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    class="w-full max-w-md rounded-2xl bg-surface border border-primary/20 p-6 shadow-xl space-y-4"
  >
    <div class="flex items-start gap-3">
      <div class="p-2.5 rounded-full bg-red-500/10 text-red-500 shrink-0">
        <lucide-icon [img]="alertIcon" class="w-6 h-6"></lucide-icon>
      </div>
      <div class="space-y-1">
        <h3 class="text-lg font-bold text-text">{{ title() }}</h3>
        <p class="text-sm opacity-75">{{ message() }}</p>
      </div>
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <button
        type="button"
        (click)="cancelAction.emit()"
        [disabled]="isLoading()"
        class="px-4 py-2 rounded-lg border border-primary/30 hover:bg-primary/10 transition-colors disabled:opacity-50"
      >
        Cancelar
      </button>

      <button
        type="button"
        (click)="confirmAction.emit()"
        [disabled]="isLoading()"
        class="px-4 py-2 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700 transition-colors disabled:opacity-50"
      >
        {{ isLoading() ? 'Eliminando...' : confirmText() }}
      </button>
    </div>
  </div>
</div>
