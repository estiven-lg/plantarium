<aside class="w-64 border-r border-primary/10 flex flex-col shrink-0 h-full">
  <nav class="p-4 flex-1 space-y-1.5">
    <a
      routerLink="/fruits"
      routerLinkActive="bg-primary/10"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-primary hover:bg-background transition font-medium"
    >
      <lucide-icon [img]="fruitsIcon" class="w-5 h-5 text-primary"></lucide-icon>
      <span>Frutas</span>
    </a>
    <a
      routerLink="/seeds"
      routerLinkActive="bg-primary/10"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 text-primary font-medium transition"
    >
      <lucide-icon [img]="seedsIcon" class="w-5 h-5 text-primary"></lucide-icon>
      <span>Semillas</span>
    </a>
    <a
      routerLink="/plants"
      routerLinkActive="bg-primary/10"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-primary hover:bg-background transition font-medium"
    >
      <lucide-icon [img]="plantsIcon" class="w-5 h-5 text-primary"></lucide-icon>
      <span>Plantas</span>
    </a>
  </nav>

  <div class="bg-accent-light py-4 px-6 border-t border-primary/10 text-sm text-primary">
    Plantarium v0.1
  </div>
</aside>
