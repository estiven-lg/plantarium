<section class="space-y-6">
  <app-fruit-list-header />
  <!-- Estado de carga -->
  @if (isLoading()) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- Generamos 6 tarjetas skeleton mientras responde la API -->
    @for (item of [1, 2, 3, 4, 5, 6]; track item) {
        <app-fruit-card-skeleton />
    }
  </div>
  } @else if (errorMessage()) {
    <!-- Estado de error -->
    <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-500">
      {{ errorMessage() }}
    </div>
  } @else {
    <!-- Listado exitoso -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (fruit of fruits(); track fruit.id) {
        <app-fruit-card [fruit]="fruit" />
      } @empty {
        <div
          class="col-span-full p-8 text-center bg-surface rounded-xl border border-dashed border-primary/30"
        >
          <p class="opacity-75">Aún no tienes frutas registradas.</p>
        </div>
      }
    </div>
  }
</section>
