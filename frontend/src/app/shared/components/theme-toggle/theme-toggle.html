<button
  type="button"
  role="switch"
  [attr.aria-checked]="themeService.isDark()"
  [attr.aria-label]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  (click)="themeService.toggleTheme()"
  class="bg-accent relative flex h-8 w-14 items-center rounded-full transition-colors duration-300 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
  /* [ngClass]="themeService.isDark() ? 'bg-blue-950' : 'bg-sky-300'" */
>
  <span
    class="absolute left-1 flex h-6 w-6 items-center justify-center rounded-full bg-white shadow-md transition-transform duration-300 ease-in-out"
    [ngClass]="themeService.isDark() ? 'translate-x-6' : 'translate-x-0'"
  >
    @if (themeService.isDark()) {
      <lucide-icon [img]="MoonIcon" class="h-4 w-4 text-primary"> </lucide-icon>
    } @else {
      <lucide-icon [img]="SunIcon" class="h-4 w-4 text-primary"> </lucide-icon>
    }
  </span>
</button>
