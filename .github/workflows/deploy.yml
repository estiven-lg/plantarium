name: Build & Deploy Plantarium

on:
  push:
    branches: ["production"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/plantarium-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/plantarium-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push Backend (.NET 10 + Bundles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build y Push Frontend (Angular + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar y migrar en VPS Oracle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/plantarium
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d postgres
            sleep 5
            docker compose -f compose.prod.yaml run --rm backend sh -c "\
              ./migrations/migrate-seeds --connection \"\$ConnectionStrings__PlantariumDatabase\" && \
              ./migrations/migrate-fruits --connection \"\$ConnectionStrings__PlantariumDatabase\" && \
              ./migrations/migrate-plants --connection \"\$ConnectionStrings__PlantariumDatabase\""
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
